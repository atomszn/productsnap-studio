<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1040" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Pulse sketch: one through-line up top, four lens tabs to read it through, evidence chips, and the one product question each lens lands on. No live numbers.">
  <defs>
    <pattern id="plt-paper" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f7f1e2"/>
      <circle cx="1.5" cy="1.5" r="0.4" fill="#d6cdb6" opacity="0.45"/>
      <circle cx="5.5" cy="4.5" r="0.3" fill="#cfc4ab" opacity="0.35"/>
    </pattern>
    <filter id="plt-rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
    <style>
      .h     { font-family: 'Caveat','Kalam',cursive; font-weight: 700; }
      .annot { font-family: 'Caveat','Kalam',cursive; font-weight: 700; fill: #c44569; }
      .b     { font-family: 'Inter','Segoe UI',sans-serif; }
      .ink   { fill: #2d2620; }
      .ghost { fill: #6b6356; }
      .px    { fill: #fdfaf0; stroke: #2d2620; stroke-width: 2; stroke-linejoin: round; }
      .px-l  { fill: none; stroke: #2d2620; stroke-width: 1.6; stroke-linecap: round; }
      .annot-line { fill: none; stroke: #c44569; stroke-width: 1.6; stroke-linecap: round; }
      .sticky { fill: #b9e4dc; stroke: #6fb8ad; stroke-width: 1.4; }
      .chip  { fill: #fff3d6; stroke: #c9a44e; stroke-width: 1.3; }
    </style>
  </defs>

  <rect width="880" height="1040" fill="url(#plt-paper)"/>

  <!-- Title -->
  <text x="40" y="56" class="h ink" font-size="34">Pulse · one thought, four lenses</text>
  <text x="40" y="84" class="b ghost" font-size="16">v0.2 sketch · structural layout only — real wording is generated from current data, not drawn here</text>
  <path class="px-l" d="M40 96 Q 440 100 840 96"/>

  <!-- THROUGH-LINE -->
  <g transform="translate(120 124)">
    <path class="px" d="M 6 6 Q 0 0 24 0 L 616 0 Q 640 0 640 24 L 640 120 Q 640 144 616 144 L 24 144 Q 0 144 0 120 L 0 24 Q 0 6 6 6 Z" fill="#fffdf6"/>
    <rect x="0" y="0" width="640" height="8" rx="4" fill="#15605a"/>
    <text x="28" y="44" class="b ghost" font-size="13" font-weight="700">THIS WEEK'S THROUGH-LINE</text>
    <text x="28" y="84" class="h ink" font-size="30">[ the one sentence the week is really about ]</text>
    <text x="28" y="118" class="b ghost" font-size="14">one plain-English idea — the single sentence the rest of the page reads through.</text>
  </g>

  <!-- LENS TABS -->
  <g transform="translate(120 296)">
    <text x="0" y="-8" class="b ghost" font-size="13" font-weight="700">READ IT THROUGH ONE LENS</text>
    <!-- active tab: Build -->
    <rect x="0" y="6" width="150" height="46" rx="10" class="px-l" fill="#ebe6fc" stroke="#6b5fd6" stroke-width="2"/>
    <text x="75" y="35" text-anchor="middle" class="b ink" font-size="14" font-weight="700">Build Decisions</text>
    <rect x="0" y="48" width="150" height="4" fill="#6b5fd6"/>
    <!-- Customer -->
    <rect x="162" y="6" width="156" height="46" rx="10" class="px-l" fill="#fdfaf0"/>
    <text x="240" y="35" text-anchor="middle" class="b ghost" font-size="14">Customer Behavior</text>
    <!-- Business -->
    <rect x="330" y="6" width="150" height="46" rx="10" class="px-l" fill="#fdfaf0"/>
    <text x="405" y="35" text-anchor="middle" class="b ghost" font-size="14">Business Reality</text>
    <!-- Future -->
    <rect x="492" y="6" width="148" height="46" rx="10" class="px-l" fill="#fdfaf0"/>
    <text x="566" y="35" text-anchor="middle" class="b ghost" font-size="14">Future Signals</text>
  </g>

  <!-- ACTIVE LENS PANEL -->
  <g transform="translate(120 372)">
    <path class="px" d="M 6 6 Q 0 0 24 0 L 616 0 Q 640 0 640 24 L 640 388 Q 640 412 616 412 L 24 412 Q 0 412 0 388 L 0 24 Q 0 6 6 6 Z" fill="#fffdf6"/>

    <text x="28" y="44" class="b ghost" font-size="12" font-weight="700">THE PATTERN</text>
    <text x="28" y="74" class="b ink" font-size="15">[ what this lens notices in plain language — two</text>
    <text x="28" y="96" class="b ink" font-size="15">signals moving in a way most people aren't holding</text>
    <text x="28" y="118" class="b ink" font-size="15">in their head at the same time. ]</text>

    <!-- evidence chips -->
    <text x="28" y="158" class="b ghost" font-size="12" font-weight="700">THE EVIDENCE</text>
    <rect x="28" y="170" width="170" height="38" rx="19" class="chip"/>
    <text x="113" y="194" text-anchor="middle" class="b ink" font-size="13" font-weight="600">[ signal A ]</text>
    <rect x="212" y="170" width="170" height="38" rx="19" class="chip"/>
    <text x="297" y="194" text-anchor="middle" class="b ink" font-size="13" font-weight="600">[ signal B ]</text>
    <text x="398" y="194" class="b ghost" font-size="13">named, never a raw number</text>

    <!-- for-example bridge -->
    <text x="28" y="250" class="b ghost" font-size="12" font-weight="700">FOR EXAMPLE</text>
    <text x="28" y="278" class="b ink" font-size="15">[ a Monday-morning product situation that makes the</text>
    <text x="28" y="300" class="b ink" font-size="15">pattern concrete — no chips, just the translation. ]</text>

    <!-- the question -->
    <g transform="translate(28 326)">
      <path class="px-l" d="M 4 4 Q 0 0 14 0 L 580 0 Q 584 0 584 14 L 584 60 Q 584 74 570 74 L 14 74 Q 0 74 0 60 L 0 14 Q 0 4 4 4 Z" fill="#ebe6fc"/>
      <text x="20" y="30" class="b ghost" font-size="12" font-weight="700">THE PRODUCT QUESTION</text>
      <text x="20" y="58" class="h ink" font-size="24">[ the one question this lens asks you to sit with ]</text>
    </g>
  </g>

  <!-- ============ MARGIN ANNOTATIONS ============ -->
  <g transform="translate(40 200)">
    <text class="annot" font-size="22" x="0" y="0">start with the</text>
    <text class="annot" font-size="22" x="0" y="26">thought, not the</text>
    <text class="annot" font-size="22" x="0" y="52">numbers</text>
    <path class="annot-line" d="M 90 30 Q 105 50 78 70"/>
    <polygon points="78,72 76,62 86,66" fill="#c44569"/>
  </g>

  <g transform="translate(724 372)">
    <rect x="0" y="0" width="152" height="110" class="sticky" transform="rotate(3)"/>
    <g transform="rotate(3)">
      <text x="14" y="28" class="h" font-size="20" fill="#155">same week,</text>
      <text x="14" y="48" class="h" font-size="20" fill="#155">four angles.</text>
      <text x="14" y="70" class="b" font-size="12" fill="#3a3128">one tab is active.</text>
      <text x="14" y="86" class="b" font-size="12" fill="#3a3128">the other three wait —</text>
      <text x="14" y="102" class="b" font-size="12" fill="#3a3128">never all at once.</text>
    </g>
    <path class="annot-line" d="M -8 16 Q -36 -2 -68 -28"/>
    <polygon points="-70,-30 -60,-30 -64,-22" fill="#c44569"/>
  </g>

  <g transform="translate(700 600)">
    <text class="annot" font-size="22" x="0" y="0">it lands on a</text>
    <text class="annot" font-size="22" x="0" y="26">question, not a</text>
    <text class="annot" font-size="22" x="0" y="52">verdict</text>
    <text class="b ink" font-size="13" x="0" y="76">a thinking tool, not an</text>
    <text class="b ink" font-size="13" x="0" y="92">oracle. Pulse never tells</text>
    <text class="b ink" font-size="13" x="0" y="108">you what to do.</text>
    <path class="annot-line" d="M -10 40 Q -60 60 -120 80"/>
    <polygon points="-122,80 -114,76 -114,84" fill="#c44569"/>
  </g>

  <text x="40" y="1018" class="b ghost" font-size="12">ProductSnap · early wireframe iteration · sketch fidelity</text>
  <text x="840" y="1018" text-anchor="end" class="b ghost" font-size="12">sketch · pulse 02</text>
</svg>
