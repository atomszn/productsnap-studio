<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1040" preserveAspectRatio="xMidYMid meet">
  <defs>
    <pattern id="paper2" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f7f1e2"/>
      <circle cx="1.5" cy="1.5" r="0.4" fill="#d6cdb6" opacity="0.45"/>
      <circle cx="5.5" cy="4.5" r="0.3" fill="#cfc4ab" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="880" height="1040" fill="url(#paper2)"/>

  <text x="40" y="56" class="h" font-size="34" fill="#2d2620">ProductSnap · Home (flip side — answer)</text>
  <text x="40" y="84" class="b" font-size="16" fill="#6b6356">v0.3 wireframe · the "snap" payoff</text>
  <path class="px-l" d="M40 96 Q 440 100 840 96"/>

  <g transform="translate(220 130)">
    <path class="px" d="M 6 6 Q 0 0 24 0 L 416 0 Q 440 0 440 24 L 440 836 Q 440 860 416 860 L 24 860 Q 0 860 0 836 L 0 24 Q 0 6 6 6 Z"/>

    <text x="20" y="28" class="b ghost" font-size="13">12:24</text>
    <text x="380" y="28" class="b ghost" font-size="13">wifi · 65%</text>
    <line x1="14" y1="42" x2="426" y2="42" class="px-l"/>

    <text x="20" y="74" class="b ink" font-size="22">≡</text>
    <text x="160" y="74" class="h" font-size="28" fill="#d6477c">ProductSnap</text>
    <circle cx="412" cy="64" r="14" class="px-l"/>
    <text x="404" y="70" class="b" font-size="14" fill="#c69200">☾</text>
    <line x1="14" y1="92" x2="426" y2="92" class="px-l"/>

    <text x="60" y="128" class="h" font-size="24">Good afternoon ·</text>
    <text x="260" y="128" class="h" font-size="24">Sat, May 2</text>
    <text x="50" y="156" class="b ghost" font-size="14">"Done is better than perfect."  — Sheryl Sandberg</text>

    <g transform="translate(36 184)">
      <path class="px" d="M 4 12 Q 0 0 20 0 L 348 0 Q 368 0 368 20 L 368 484 Q 368 504 348 504 L 20 504 Q 0 504 0 484 L 0 20 Q 0 4 4 12 Z" fill="#fdfaf0"/>
      <rect x="0" y="20" width="6" height="464" fill="#6b5fd6" opacity="0.6"/>

      <text x="20" y="40" class="b" font-size="12" font-weight="700" fill="#5a4ec7">PRIORITIZATION &amp; ROADMAPPING</text>

      <circle cx="334" cy="38" r="14" class="px-l"/>
      <path d="M329 32 L329 46 L334 43 L339 46 L339 32 Z" stroke="#2d2620" stroke-width="1.2" fill="none"/>

      <text x="20" y="84" class="h" font-size="22" fill="#6b5fd6">WHAT</text>
      <text x="20" y="110" class="b ink" font-size="13">An Impact vs. Effort Matrix plots ideas by</text>
      <text x="20" y="128" class="b ink" font-size="13">expected user or business value against</text>
      <text x="20" y="146" class="b ink" font-size="13">the work required to deliver them.</text>

      <rect x="14" y="172" width="340" height="120" rx="8" fill="#fff3d6" stroke="#d4b85e" stroke-width="1"/>
      <text x="28" y="196" class="h" font-size="20" fill="#8a5e10">WHY IT MATTERS</text>
      <text x="28" y="220" class="b ink" font-size="13">It quickly exposes quick wins, big</text>
      <text x="28" y="238" class="b ink" font-size="13">bets, distractions, and time-wasters.</text>
      <text x="28" y="256" class="b ink" font-size="13">Use it when teams need fast</text>
      <text x="28" y="274" class="b ink" font-size="13">alignment, not perfect math.</text>

      <line x1="20" y1="316" x2="348" y2="316" class="px-l" stroke-dasharray="3 3"/>

      <text x="20" y="342" class="h" font-size="22" fill="#2da76b">REAL-WORLD EXAMPLE</text>
      <text x="20" y="368" class="b ink" font-size="13">A team ships a copy fix that improves</text>
      <text x="20" y="386" class="b ink" font-size="13">checkout clarity before starting a</text>
      <text x="20" y="404" class="b ink" font-size="13">multi-month redesign with uncertain</text>
      <text x="20" y="422" class="b ink" font-size="13">payoff. Sequence wisely.</text>
    </g>

    <g transform="translate(120 712)">
      <circle cx="14" cy="14" r="14" class="px-l" fill="#fdfaf0"/>
      <text x="14" y="20" text-anchor="middle" class="b ink" font-size="16">‹</text>
      <rect x="50" y="0" width="100" height="28" rx="14" class="px-l" fill="#fdfaf0"/>
      <text x="100" y="20" text-anchor="middle" class="b ink" font-size="13">1 / 108</text>
      <circle cx="186" cy="14" r="14" class="px-l" fill="#fdfaf0"/>
      <text x="186" y="20" text-anchor="middle" class="b ink" font-size="16">›</text>
    </g>

    <g transform="translate(54 752)">
      <path class="px-l" d="M 4 4 Q 0 0 14 0 L 150 0 Q 164 0 164 14 L 164 44 Q 164 58 150 58 L 14 58 Q 0 58 0 44 L 0 14 Q 0 4 4 4 Z" fill="#ffe1ec"/>
      <text x="82" y="36" text-anchor="middle" class="b" font-size="14" font-weight="700" fill="#c43360">🔄  Review Again</text>
    </g>
    <g transform="translate(228 752)">
      <path class="px-l" d="M 4 4 Q 0 0 14 0 L 150 0 Q 164 0 164 14 L 164 44 Q 164 58 150 58 L 14 58 Q 0 58 0 44 L 0 14 Q 0 4 4 4 Z" fill="#33a973"/>
      <text x="82" y="36" text-anchor="middle" class="b" font-size="14" font-weight="700" fill="#fdfaf0">✓  Got it</text>
    </g>

    <line x1="14" y1="816" x2="426" y2="816" class="px-l"/>
    <g class="b" font-size="11" fill="#6b6356">
      <text x="42" y="852" text-anchor="middle">🏠</text><text x="42" y="868" text-anchor="middle" fill="#6b5fd6">Home</text>
      <text x="124" y="852" text-anchor="middle">📚</text><text x="124" y="868" text-anchor="middle">Browse</text>
      <text x="220" y="852" text-anchor="middle">🏋</text><text x="220" y="868" text-anchor="middle">Gym</text>
      <text x="316" y="852" text-anchor="middle">📰</text><text x="316" y="868" text-anchor="middle">Stories</text>
      <text x="398" y="852" text-anchor="middle">📈</text><text x="398" y="868" text-anchor="middle">Progress</text>
    </g>
  </g>

  <g transform="translate(40 330)">
    <text class="annot" font-size="22" x="0" y="0">3-part frame</text>
    <text class="b ink" font-size="13" x="0" y="22">WHAT — define it crisply</text>
    <text class="b ink" font-size="13" x="0" y="38">WHY — emotional/strategic hook</text>
    <text class="b ink" font-size="13" x="0" y="54">EXAMPLE — make it stick</text>
    <text class="b ink" font-size="13" x="0" y="78">→ this IS the product</text>
    <text class="b ink" font-size="13" x="0" y="94">  thinking model.</text>
    <path class="annot-line" d="M 160 30 Q 200 60 250 80"/>
    <polygon points="252,80 244,75 244,84" fill="#c44569"/>
  </g>

  <g transform="translate(680 410)">
    <rect x="0" y="0" width="180" height="130" class="sticky" transform="rotate(-2)"/>
    <g transform="rotate(-2)">
      <text x="14" y="28" class="h" font-size="20" fill="#7a5d00">colour coding</text>
      <text x="14" y="52" class="b" font-size="13" fill="#3a3128">WHAT  = teal/purple</text>
      <text x="14" y="70" class="b" font-size="13" fill="#3a3128">WHY   = warm cream</text>
      <text x="14" y="88" class="b" font-size="13" fill="#3a3128">EXAMP = green</text>
      <text x="14" y="112" class="b" font-size="12" fill="#3a3128">— each colour earns its own role.</text>
    </g>
    <path class="annot-line" d="M -10 60 Q -50 70 -90 70"/>
    <polygon points="-92,70 -84,66 -84,74" fill="#c44569"/>
  </g>

  <g transform="translate(40 800)">
    <text class="annot" font-size="22" x="0" y="0">spaced repetition</text>
    <text class="b ink" font-size="13" x="0" y="22">Review Again → back into</text>
    <text class="b ink" font-size="13" x="0" y="38">deck soon. Got it → push out.</text>
    <text class="b ink" font-size="13" x="0" y="58">two buttons, two colors —</text>
    <text class="b ink" font-size="13" x="0" y="74">honest about effort, not</text>
    <text class="b ink" font-size="13" x="0" y="90">gamified into noise.</text>
    <path class="annot-line" d="M 180 80 Q 220 90 250 70"/>
    <polygon points="252,70 244,66 244,74" fill="#c44569"/>
  </g>

  <g transform="translate(680 800)">
    <text class="annot" font-size="22" x="0" y="0">card counter</text>
    <text class="b ink" font-size="13" x="0" y="22">1 / 108 — visible</text>
    <text class="b ink" font-size="13" x="0" y="38">progress, low pressure.</text>
    <text class="b ink" font-size="13" x="0" y="58">no streaks. no scores.</text>
    <text class="b ink" font-size="13" x="0" y="74">just movement.</text>
    <path class="annot-line" d="M -10 16 Q -60 40 -110 60"/>
    <polygon points="-112,60 -104,56 -104,64" fill="#c44569"/>
  </g>

  <text x="40" y="1018" class="b ghost" font-size="12">ProductSnap · early wireframe iteration · sketch fidelity</text>
  <text x="840" y="1018" text-anchor="end" class="b ghost" font-size="12">screen 02 / 06</text>
</svg>